name: Auto-merge student PR

on:
  pull_request_target:
    types: [opened, synchronize, reopened, labeled]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  guard:
    runs-on: ubuntu-latest
    concurrency:
      group: guard-pr-${{ github.event.pull_request.number }}
      cancel-in-progress: true
    steps:
      - name: Safety check
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          FAIL_MSG=""
          fail() { FAIL_MSG="${FAIL_MSG}
          - $1"; }

          [ "${BASE_REF:-}" = "main" ] || fail "base branch harus main, bukan ${BASE_REF:-?}"

          MERGEABLE="unknown"
          for _ in $(seq 1 12); do
            MERGEABLE=$(gh api "repos/$REPO/pulls/$PR_NUMBER" --jq '.mergeable // "unknown"')
            case "$MERGEABLE" in true|false) break ;; *) sleep 10 ;; esac
          done
          [ "$MERGEABLE" = "true" ] || fail "PR belum mergeable (status=$MERGEABLE, kemungkinan conflict). Sinkronkan branch dengan main terbaru lalu push lagi."

          AUTHOR_NIM=$(tr -cs '0-9' '\n' <<<"$AUTHOR" | grep -E '^2306[0-9]{7,}$' | head -n1 || true)
          ALLOWED="$AUTHOR_NIM"
          if [ -z "$ALLOWED" ]; then
            echo "WARNING: author $AUTHOR tidak memuat NIM, cek folder-sendiri nonaktif"
          fi

          # Pemisah field memakai US (\x1f), bukan TAB: TAB akan "collapse"
          # field kosong sehingga previous_filename ikut berisi angka.
          FILES_TSV=$(gh api --paginate "repos/$REPO/pulls/$PR_NUMBER/files" \
            --jq '.[] | [.status, .filename, (.previous_filename // ""), .deletions, .additions] | join("\u001f")')

          TOTAL_FILES=$(grep -cve '^[[:space:]]*$' <<<"$FILES_TSV" || true)
          if [ "$TOTAL_FILES" -eq 0 ]; then
            fail "PR tidak membawa perubahan file"
          fi
          if [ "$TOTAL_FILES" -gt 200 ]; then
            fail "PR terlalu besar ($TOTAL_FILES file, batas 200)"
          fi

          TOTAL_DEL=$(awk -F'\037' '{d+=$4} END {print d+0}' <<<"$FILES_TSV")
          if [ "$TOTAL_DEL" -gt 500 ]; then
            fail "total $TOTAL_DEL baris terhapus (>500), perlu review manual"
          fi

          # Deteksi conflict marker via diff PR (sekali panggil, fork-safe, tanpa checkout)
          PR_DIFF=$(gh api "repos/$REPO/pulls/$PR_NUMBER" -H "Accept: application/vnd.github.v3.diff" 2>/dev/null || true)
          MARKER_FILE=""
          if [ -n "$PR_DIFF" ]; then
            CUR=""
            while IFS= read -r line; do
              case "$line" in
                "diff --git a/"*)
                  CUR="${line##* b/}"
                  ;;
                "+"*)
                  rest="${line:1}"
                  case "$rest" in
                    "<<<<<<<"*|">>>>>>>"*|"|||||||"*)
                      MARKER_FILE="$CUR"; break ;;
                  esac
                  ;;
              esac
            done <<< "$PR_DIFF"
          fi
          if [ -n "$MARKER_FILE" ]; then
            fail "berisi conflict marker: $MARKER_FILE"
          fi

          while IFS=$'\x1f' read -r status filename prev _del _add; do
            [ -n "${status:-}" ] || continue
            if [ "$status" = "removed" ]; then
              fail "menghapus file: $filename"
            fi
            case "$filename" in
              README.md|.gitignore|.github/*)
                if [ "$AUTHOR" != "yysofiyan" ]; then
                  fail "menyentuh file lindung repo: $filename"
                fi
                ;;
            esac
            for p in "$filename" ${prev:+"$prev"}; do
              nims=$(tr -cs '0-9' '\n' <<<"$p" | grep -E '^2306[0-9]{7,}$' | sort -u || true)
              for nim in $nims; do
                if [ -n "$ALLOWED" ] && [ "$nim" != "$ALLOWED" ]; then
                  fail "menyentuh data mahasiswa lain ($nim): $p"
                fi
              done
            done
            # Aturan folder NIM: berkas WAJIB berada di dalam folder milik satu NIM
            # (kelas B: <NIM>/... ; kelas A: tugas-N/<NIM-Nama>/...). Berkas yang
            # diletakkan di luar folder NIM (mis. di root repo) ditolak.
            # Hanya path BARU yang diperiksa: rename dari luar folder NIM ke folder
            # sendiri (kebersihan submission) tetap boleh.
            if [ "$AUTHOR" != "yysofiyan" ]; then
              case "$filename" in
                README.md|.gitignore|.github/*) ;;
                *)
                  nim_path=$(printf '%s\n' "$filename" | cut -d/ -f1,2 | tr '/' '\n' \
                    | tr -cs '0-9' '\n' | grep -E '^2306[0-9]{7,}$' | head -n1 || true)
                  if [ -z "$nim_path" ]; then
                    fail "berkas di luar folder NIM: $filename"
                  else
                    PR_NIMS="${PR_NIMS:-} $nim_path"
                  fi
                  ;;
              esac
            fi
          done <<<"$FILES_TSV"

          if [ "$AUTHOR" != "yysofiyan" ]; then
            UNIQ_NIMS=$(printf '%s\n' $PR_NIMS | tr ' ' '\n' | sort -u | sed '/^$/d')
            NIM_COUNT=$(printf '%s\n' "$UNIQ_NIMS" | grep -c . || true)
            if [ "$NIM_COUNT" -gt 1 ]; then
              fail "PR menyentuh folder lebih dari satu mahasiswa: $(printf '%s' "$UNIQ_NIMS" | tr '\n' ' ')"
            fi
          fi

          OLD_IDS=$(gh api --paginate "repos/$REPO/issues/$PR_NUMBER/comments" \
            --jq '.[] | select(.user.login=="github-actions[bot]") | select((.body // "") | contains("Auto-merge")) | .id' || true)
          for cid in $OLD_IDS; do
            gh api -X DELETE "repos/$REPO/issues/comments/$cid" --silent >/dev/null 2>&1 || true
          done

          if [ -n "$FAIL_MSG" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "❌ Auto-merge ditolak, perlu review manual:$FAIL_MSG" >/dev/null
            echo "Safety check GAGAL:$FAIL_MSG"
            exit 1
          fi
          echo "Safety check LOLOS ($TOTAL_FILES file, $TOTAL_DEL baris hapus)."

  auto-merge:
    needs: guard
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    concurrency:
      group: auto-merge-main-merge
      cancel-in-progress: false
    steps:
      - name: Merge PR yang lolos guard
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          AUTHOR: ${{ github.event.pull_request.user.login }}
          HAS_LABEL: ${{ contains(github.event.pull_request.labels.*.name, 'auto-merge') }}
        run: |
          set -euo pipefail
          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" != "OPEN" ]; then
            echo "PR sudah $STATE, skip."
            exit 0
          fi
          AUTHOR_NIM=$(tr -cs '0-9' '\n' <<<"$AUTHOR" | grep -E '^2306[0-9]{7,}$' | head -n1 || true)
          if [ -z "$AUTHOR_NIM" ] && [ "$HAS_LABEL" != "true" ]; then
            echo "Skip: login $AUTHOR tidak memuat NIM dan tanpa label auto-merge."
            exit 0
          fi

          gh pr merge "$PR_NUMBER" --repo "$REPO" --merge || true

          STATE=$(gh pr view "$PR_NUMBER" --repo "$REPO" --json state --jq .state)
          if [ "$STATE" = "MERGED" ]; then
            gh pr comment "$PR_NUMBER" --repo "$REPO" \
              --body "✅ Auto-merge sukses, safety check lolos." >/dev/null || true
            echo "PR #$PR_NUMBER merged."
          else
            echo "::error::Gagal merge PR #$PR_NUMBER (state=$STATE)"
            exit 1
          fi
